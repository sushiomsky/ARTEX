# ARTEX Tencent TSec Benchmark eval image — local one-step build + run.
# Independent of the production docker-compose.yml (multi-service: artex+postgres).
# Usage:
#   cp bench/.env.example bench/.env   # fill in LLM_API_KEY / BENCHMARK_TOKEN etc.
#   docker compose -f docker-compose.bench.yml up --build      # build + run in foreground (logs)
#   docker compose -f docker-compose.bench.yml up --build -d   # background
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # stop (add -v to also drop data volumes)
# Browser: http://localhost:8787 (log in with ADMIN_PASSWORD)

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # Share the host network stack: the container uses the host network directly and can reach target networks on the host/VPN.
    # In host mode no ports mapping is needed; the container binds host ports directly: 8787 (UI/API), 8788 (proxy),
    # plus the internal PostgreSQL 5432 — keep all three free on the host (stop anything occupying them before local eval).
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
